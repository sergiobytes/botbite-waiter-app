<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <shared-title title="Menús" description="Administra la sucursal seleccionada" />

    <div class="flex items-center gap-2 self-start sm:self-auto">
      <button
        class="rounded-xl bg-black text-white px-4 py-2 hover:opacity-90 disabled:opacity-50 transition-all hover:animate-scale cursor-pointer"
        (click)="openCreate()"
        [disabled]="!branchId()"
        aria-label="Crear nuevo menú"
      >
        <div class="flex items-center gap-2">
          <lucide-icon [img]="iconsService.add" size="15" color="white"></lucide-icon>
          <span> Nuevo menú </span>
        </div>
      </button>
    </div>
  </div>

  <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center">
    <div class="md:ml-auto flex flex-col md:flex-row items-stretch md:items-center gap-2 w-full md:w-auto">
      <lucide-icon [img]="iconsService.search" size="15" color="black"></lucide-icon>
      <input
        type="text"
        placeholder="Buscar..."
        class="rounded-xl border border-black/10 px-3 py-2 w-64"
        [value]="searchTerm()"
        (input)="updateFilterSearch($event)"
        aria-label="Buscar menús"
      />
      <select
        class="rounded-xl border border-black/10 px-3 py-2"
        [value]="activeFilterValue()"
        (change)="updateFilterActive($event)"
        aria-label="Filtrar por estado"
      >
        <option value="">Todos</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
    </div>
  </div>

  <div class="rounded-2xl border border-black/10 overflow-hidden overflow-x-auto">
    <table class="w-full text-sm table-fixed min-w-[800px]">
      <thead class="bg-neutral-50 text-neutral-600">
        <tr>
          <th class="text-left font-medium px-4 py-3 w-1/5">Nombre</th>
          <th class="text-left font-medium px-4 py-3 w-32">PDF</th>
          <th class="text-left font-medium px-4 py-3 w-28">Estado</th>
          <th class="text-right font-medium px-4 py-3">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for(menu of menus(); track menu.id) {
        <tr class="border-t border-black/10 animate-fade-in animate-duration-300">
          <td class="px-4 py-3 w-1/5 truncate" [title]="menu.name">{{ menu.name }}</td>
          <td class="px-4 py-3 w-32">
            <div class="flex items-center gap-2">
              @if(!menu.pdfLink) {
              <span class="text-sm text-red-600 font-medium">No cargado</span>
              } @else {
              <button
                (click)="downloadPdf(menu)"
                class="px-3 py-1 border border-blue-200 bg-blue-100 text-blue-800 rounded-lg hover:bg-blue-50 transition-all hover:animate-scale cursor-pointer"
                [attr.aria-label]="'Descargar PDF del menú ' + menu.name"
              >
                <div class="flex items-center gap-2">
                  <lucide-icon
                    [img]="iconsService.downloadFile"
                    size="15"
                    color="blue"
                  ></lucide-icon>
                  <span class="text-sm font-medium">Descargar </span>
                </div>
              </button>
              }
            </div>
          </td>
          <td class="px-4 py-3 w-28">
            <div
              class="inline-flex items-center gap-2 rounded-full border text-xs px-2 py-1"
              [class]="
                menu.isActive
                  ? 'bg-green-100 text-green-800 border-green-200'
                  : 'bg-red-100 text-red-800 border-red-200'
              "
            >
              <lucide-icon
                [img]="menu.isActive ? iconsService.active : iconsService.inactive"
                size="20"
                [color]="menu.isActive ? 'green' : 'red'"
              ></lucide-icon>

              <span class="">
                {{ menu.isActive ? 'Activo' : 'Inactivo' }}
              </span>
            </div>
          </td>
          <td class="px-4 py-3">
            <div class="flex items-center gap-2 justify-end flex-wrap">
              <!-- Cargar menú -->
              <input
                #pdfInput
                type="file"
                accept=".pdf,application/pdf"
                class="hidden"
                (change)="onPdfSelected($event, menu.id)"
              />
              <button
                class="w-12 md:w-28 px-2 py-1 border rounded-lg transition-all hover:animate-scale cursor-pointer"
                (click)="pdfInput.click()"
              >
                <div class="flex items-center justify-center gap-1">
                  <lucide-icon
                    [img]="iconsService.uploadFile"
                    size="15"
                    color="green"
                  ></lucide-icon>
                  <span class="text-xs hidden md:inline"> Cargar menú </span>
                </div>
              </button>
              <!-- Ver items del menú -->
              <button
                class="w-12 md:w-24 px-2 py-1 border border-blue-200 bg-blue-100 text-blue-800 rounded-lg hover:bg-blue-50 transition-all hover:animate-scale cursor-pointer"
                (click)="viewProducts(menu)"
                [attr.aria-label]="'Ver productos del menú ' + menu.name"
              >
                <div class="flex items-center justify-center gap-1">
                  <lucide-icon [img]="iconsService.eye" size="15" color="blue"></lucide-icon>
                  <span class="text-xs hidden md:inline">Productos</span>
                </div>
              </button>
              <!-- Editar -->
              <button
                class="w-12 md:w-20 px-2 py-1 border border-yellow-200 bg-yellow-100 text-yellow-800 rounded-lg hover:bg-yellow-50 transition-all hover:animate-scale cursor-pointer"
                (click)="openEdit(menu)"
                [attr.aria-label]="'Editar menú ' + menu.name"
              >
                <div class="flex items-center justify-center gap-1">
                  <lucide-icon [img]="iconsService.edit" size="15" color="orange"></lucide-icon>
                  <span class="text-xs hidden md:inline">Editar</span>
                </div>
              </button>
              <!-- Desactivar/Activar -->
              <button
                class="w-12 md:w-24 px-2 py-1 border rounded-lg transition-all hover:animate-scale cursor-pointer"
                [class]="
                  menu.isActive
                    ? 'bg-red-100 text-red-800 border-red-200 hover:bg-red-50'
                    : 'bg-green-100 text-green-800 border-green-200 hover:bg-green-50'
                "
                [attr.aria-label]="(menu.isActive ? 'Desactivar ' : 'Activar ') + menu.name"
                (click)="confirmToggle(menu, menu.isActive)"
              >
                <div class="flex items-center justify-center gap-1">
                  <lucide-icon
                    [img]="menu.isActive ? iconsService.disable : iconsService.active"
                    size="15"
                    [color]="menu.isActive ? 'red' : 'green'"
                  ></lucide-icon>
                  <span class="text-xs hidden md:inline">{{ menu.isActive ? 'Desactivar' : 'Activar' }}</span>
                </div>
              </button>
            </div>
          </td>
        </tr>
        } @empty {
        <app-empty-state
          [loading]="loading()"
          [isEmpty]="menus().length === 0"
          [colspan]="3"
          message="No hay menús para mostrar."
        />
        }
      </tbody>
    </table>
  </div>

  <app-pagination
    [total]="total()"
    [pageFrom]="pageFrom()"
    [pageTo]="pageTo()"
    [canPrev]="canPrev()"
    [canNext]="canNext()"
    (previousPage)="prevPage()"
    (nextPage)="nextPage()"
    (limitChange)="changeLimit($event)"
  />

  <app-modal
    [isOpen]="mode() !== null"
    [title]="modalTitle()"
    [maxWidth]="'max-w-2xl'"
    [showActions]="true"
    [loading]="saving()"
    [confirmDisabled]="!isFormValid()"
    confirmText="Guardar"
    (close)="closeModal()"
    (cancel)="closeModal()"
    (confirm)="save()"
  >
    <form (submit)="$event.preventDefault()" class="space-y-4">
      <div class="space-y-1">
        <label for="restaurantName" class="text-sm font-medium">Nombre</label>
        <input
          id="restaurantName"
          type="text"
          class="w-full rounded-xl border border-black/10 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black/20"
          [value]="form().name"
          (input)="updateForm('name', $event)"
          required
          maxlength="80"
          aria-required="true"
        />
      </div>

      <div class="flex items-center gap-2">
        <input
          id="active"
          type="checkbox"
          [checked]="form().isActive"
          (change)="updateForm('isActive', $event)"
          class="rounded"
        />
        <label for="active" class="text-sm">Activa</label>
      </div>

      @if (!isFormValid() && form().name) {
      <p class="text-sm text-red-600">El nombre es obligatorio</p>
      }
    </form>
  </app-modal>

  <app-modal
    [isOpen]="confirming()"
    [title]="confirmTitle()"
    [maxWidth]="'max-w-sm'"
    [showActions]="true"
    confirmText="Confirmar"
    (close)="closeConfirmation()"
    (cancel)="closeConfirmation()"
    (confirm)="toggleActive()"
  >
    <p class="text-sm text-neutral-600">{{ confirmMessage() }}</p>
  </app-modal>
</div>
