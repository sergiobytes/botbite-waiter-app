<div class="min-h-svh bg-white text-black flex">
  <!-- SIDENAV -->
  <aside
    class="fixed z-40 inset-y-0 left-0 w-72 bg-black text-white transform transition-transform duration-200 lg:translate-x-0"
    [class.-translate-x-full]="!open()"
    aria-label="Sidebar"
  >
    <div class="h-full flex flex-col">
      <div class="px-5 py-4 border-b border-white/10">
        <div class="text-2xl font-semibold tracking-tight">BotBite</div>
        <p class="text-white/60 text-xs mt-1">Panel de administración</p>
      </div>

      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <a
          *ngFor="let item of items"
          [routerLink]="item.to"
          routerLinkActive="bg-white/10"
          class="block rounded-xl px-4 py-3 text-sm hover:bg-white/10 transition"
          (click)="closeOnNavigate()"
        >
          <span class="align-middle">{{ item.label }}</span>
        </a>
      </nav>

      <div class="p-4 border-t border-white/10">
        <button
          (click)="logout()"
          class="w-full rounded-xl bg-white text-black py-3 hover:opacity-90 transition text-sm"
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </aside>

  <!-- OVERLAY para móvil -->
  <div
    class="fixed inset-0 bg-black/40 z-30 lg:hidden"
    *ngIf="open()"
    (click)="toggle()"
    aria-hidden="true"
  ></div>

  <!-- CONTENIDO -->
  <div class="flex-1 flex flex-col lg:ml-72">
    <!-- TOPBAR -->
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-black/10">
      <div class="h-14 px-4 flex items-center justify-between min-w-0">
        <div class="flex items-center gap-3 min-w-0">
          <button
            class="lg:hidden rounded-xl border border-black/10 px-3 py-2"
            (click)="toggle()"
            aria-label="Abrir menú"
          >
            <span class="block w-5 h-0.5 bg-black mb-1"></span>
            <span class="block w-5 h-0.5 bg-black mb-1"></span>
            <span class="block w-5 h-0.5 bg-black"></span>
          </button>

          <ng-container *ngIf="restaurants().length > 0; else empty">
            <ng-container *ngIf="restaurants().length > 1; else singleRestaurant">
              <label class="sr-only" for="restaurantSelect">Restaurante</label>
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-neutral-700">Restaurante:</span>
                <select
                  id="restaurantSelect"
                  [ngModel]="selectedRestaurantId()"
                  (ngModelChange)="onSelectRestaurant($event)"
                  class="text-sm rounded-lg border border-black/10 px-3 py-2 bg-white text-black focus:outline-none focus:ring-2 focus:ring-black/20 max-w-3xs md:max-w-80"
                >
                  <option *ngFor="let r of restaurants()" [value]="r.id">
                    {{ r.name }}
                  </option>
                </select>
              </div>
            </ng-container>

            <ng-template #singleRestaurant>
              <div class="text-sm text-neutral-700 truncate">
                <span class="font-medium">Restaurante: </span>
                <span class="text-neutral-900">{{ selectedRestaurant()?.name }}</span>
              </div>
            </ng-template>
          </ng-container>

          <ng-template #empty></ng-template>
        </div>

        <!-- USUARIO ACTIVO -->
        <div class="flex items-center gap-4 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <!-- Email -->
            <span
              class="hidden sm:inline text-sm text-neutral-700 whitespace-nowrap overflow-hidden text-ellipsis max-w-[200px] md:max-w-[280px] lg:max-w-[360px] xl:max-w-[420px]"
              [title]="auth.user()?.email"
            >
              {{ auth.user()?.email }}
            </span>

            <!-- Badge del rol -->
            <span
              *ngIf="bestRole(auth.user()?.roles)"
              [ngClass]="getRoleBadgeClass(bestRole(auth.user()?.roles))"
              class="border text-xs font-medium px-2 py-0.5 rounded-full whitespace-nowrap transition-colors"
            >
              {{ bestRole(auth.user()?.roles) }}
            </span>
          </div>

          <!-- Botón engranaje -->
          <button
            class="p-2 rounded-full border border-black/10 hover:bg-black/5 transition"
            title="Editar perfil"
            (click)="goToProfile()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.591 1.066c1.543-.937 3.316.836 2.379 2.379a1.724 1.724 0 001.065 2.591c1.757.426 1.757 2.924 0 3.35a1.724 1.724 0 00-1.065 2.591c.937 1.543-.836 3.316-2.379 2.379a1.724 1.724 0 00-2.591 1.065c-.426 1.757-2.924 1.757-3.35 0a1.724 1.724 0 00-2.591-1.065c-1.543.937-3.316-.836-2.379-2.379a1.724 1.724 0 00-1.065-2.591c-1.757-.426-1.757-2.924 0-3.35a1.724 1.724 0 001.065-2.591c-.937-1.543.836-3.316 2.379-2.379.886.538 2.017.165 2.591-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
