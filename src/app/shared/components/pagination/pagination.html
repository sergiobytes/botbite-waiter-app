<div class="flex flex-col md:flex-row items-center justify-between gap-3">
  <div class="text-sm text-neutral-600 text-center md:text-left">
    <span class="hidden md:inline">Mostrando </span>{{ pageFrom() }} - {{ pageTo() }} de {{ total() }}
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      [disabled]="!canPrev()"
      (click)="previousPage.emit()"
      class="rounded-xl border border-black/10 px-3 md:px-4 py-2 hover:bg-black/5 transition-all hover:animate-scale cursor-pointer"
      [class.opacity-50]="!canPrev()"
      [class.cursor-not-allowed]="!canPrev()"
      aria-label="Página anterior"
    >
      <div class="flex items-center gap-2">
        <lucide-icon [img]="iconsService.previous" size="15" color="black"></lucide-icon>
        <span class="hidden md:inline">Anterior</span>
      </div>
    </button>
    <button
      type="button"
      [disabled]="!canNext()"
      (click)="nextPage.emit()"
      class="rounded-xl border border-black/10 px-3 md:px-4 py-2 hover:bg-black/5 transition-all hover:animate-scale cursor-pointer"
      [class.opacity-50]="!canNext()"
      [class.cursor-not-allowed]="!canNext()"
      aria-label="Página siguiente"
    >
      <div class="flex items-center gap-2">
        <span class="hidden md:inline">Siguiente</span>
        <lucide-icon [img]="iconsService.next" size="15" color="black"></lucide-icon>
      </div>
    </button>

    @if (showLimitSelector()) {
    <select
      [value]="currentLimit()"
      (change)="limitChange.emit($event)"
      class="rounded-xl border border-black/10 px-3 py-2"
      aria-label="Elementos por página"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    }
  </div>
</div>
