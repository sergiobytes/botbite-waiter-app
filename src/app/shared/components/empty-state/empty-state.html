@if (loading()) {
  <tr>
    <td [attr.colspan]="colspan()" class="px-4 py-8 text-center" role="status" aria-live="polite">
      <div class="animate-pulse space-y-2" aria-label="Cargando contenido">
        <div class="mx-auto h-4 w-3/4 rounded bg-neutral-200" aria-hidden="true"></div>
        <div class="mx-auto h-4 w-1/2 rounded bg-neutral-200" aria-hidden="true"></div>
      </div>
    </td>
  </tr>
} @else if (isEmpty()) {
  <tr>
    <td [attr.colspan]="colspan()" class="px-4 py-8 text-center text-neutral-500" role="status">
      {{ message() }}
    </td>
  </tr>
}
